name: E2E browser tests

# No `push: branches: [main]` trigger. The suite currently carries nine
# deliberate characterization tests that are red by design, so it exits
# non-zero unconditionally and cannot gate a branch. Add the push trigger
# only after those findings are triaged --- see
# docs/superpowers/reports/2026-08-03-e2e-findings.md, section 8.
on:
  pull_request:
    paths:
      - 'public/**'
      - 'views/**'
      - 'routes/**'
      - 'models/**'
      - 'services/**'
      - 'util/**'
      - 'supabase/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Pinned for the same reason as integration.yml -- see the note there.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.84.4
      - run: bun install --frozen-lockfile
      - run: supabase start
      # Safe here, and only here: CI gets a fresh ephemeral database. The
      # never-reset rule protects a developer's local stack, not this one.
      - run: supabase db reset
      # REQUIRED before seeding. `bun run seed:local` guards on a local
      # SUPABASE_URL that it reads from the .env FILE (parseEnvUrl() in
      # scripts/seed-local.mjs returns "" when the file is absent), never from
      # the environment --- so inline SUPABASE_URL=... below cannot satisfy it.
      # .env is gitignored, so a fresh checkout has none and the guard calls
      # process.exit(1) before anything is seeded.
      #
      # Do NOT "fix" this with `--force`. That bypasses the guard entirely, and
      # the guard is what stops seed:admin creating the known-password dev admin
      # (dummy@testing.com) against whatever SUPABASE_URL happens to point at.
      # Writing the file keeps the check honest: if this workflow were ever
      # wired to a cloud project, the guard would still refuse.
      - name: Write .env for the local stack
        run: |
          eval "$(supabase status -o env)"
          cat > .env <<EOF
          SUPABASE_URL=$API_URL
          SUPABASE_PUBLISHABLE_KEY=$ANON_KEY
          SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          SUPABASE_DB_URL=$DB_URL
          EOF
      - name: Seed local app data
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" \
          SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$SERVICE_ROLE_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          SUPABASE_DB_URL="$DB_URL" \
          bun run seed:local
      # --with-deps is required in CI: the runner has none of Chromium's
      # shared libraries. Local installs skip it because it needs sudo.
      - run: bunx playwright install --with-deps chromium
      - name: Run E2E suite
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" \
          SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$SERVICE_ROLE_KEY" \
          SUPABASE_DB_URL="$DB_URL" \
          bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/report/html
            e2e/report/artifacts
          retention-days: 7
