name: E2E browser tests

# The nine deliberate characterization tests that used to make this suite exit
# non-zero unconditionally (docs/superpowers/reports/2026-08-03-e2e-findings.md,
# measured on e2e-browser-tier at 020cc69: 71 passed, 9 failed) have all been
# triaged -- the ar-h6rt and ar-7v3k fixes landed and flipped them green, which
# is what they were built to do. The suite is 109/109, so it can gate a branch
# and the push trigger is back.
#
# Note this workflow could not run at all between 2026-07-10 and 2026-08-11:
# `supabase start` failed at config parse on every branch until the CLI pin
# below. Read any green older than that as "did not execute", not "passed".
on:
  pull_request:
    paths:
      - 'public/**'
      - 'views/**'
      - 'routes/**'
      - 'models/**'
      - 'services/**'
      - 'util/**'
      - 'supabase/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'bun.lock'
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'views/**'
      - 'routes/**'
      - 'models/**'
      - 'services/**'
      - 'util/**'
      - 'supabase/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'bun.lock'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Pinned for the same reason as integration.yml -- see the note there.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.84.4
      - run: bun install --frozen-lockfile
      - run: supabase start
      # Safe here, and only here: CI gets a fresh ephemeral database. The
      # never-reset rule protects a developer's local stack, not this one.
      - run: supabase db reset
      # REQUIRED before seeding. `bun run seed:local` guards on a local
      # SUPABASE_URL that it reads from the .env FILE (parseEnvUrl() in
      # scripts/seed-local.mjs returns "" when the file is absent), never from
      # the environment --- so inline SUPABASE_URL=... below cannot satisfy it.
      # .env is gitignored, so a fresh checkout has none and the guard calls
      # process.exit(1) before anything is seeded.
      #
      # Do NOT "fix" this with `--force`. That bypasses the guard entirely, and
      # the guard is what stops seed:admin creating the known-password dev admin
      # (dummy@testing.com) against whatever SUPABASE_URL happens to point at.
      # Writing the file keeps the check honest: if this workflow were ever
      # wired to a cloud project, the guard would still refuse.
      #
      # OPENAI_API_KEY is a placeholder, never a real key. util/mission-import.js
      # builds an OpenAIChatApi at import time and llm-api throws on an empty
      # key, and app.js -> routes/characters.js -> util/character-import.js
      # reaches it on every boot -- so without this the Playwright webServer
      # exits 1 before serving a single request. Nothing in the suite calls the
      # model; the value only has to be non-empty. Same reasoning as the
      # placeholder in scripts/run-tests.mjs, which covers the other tiers.
      - name: Write .env for the local stack
        run: |
          eval "$(supabase status -o env)"
          cat > .env <<EOF
          SUPABASE_URL=$API_URL
          SUPABASE_PUBLISHABLE_KEY=$ANON_KEY
          SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY
          SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY
          SUPABASE_DB_URL=$DB_URL
          OPENAI_API_KEY=test-openai-key
          EOF
      - name: Seed local app data
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" \
          SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$SERVICE_ROLE_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          SUPABASE_DB_URL="$DB_URL" \
          bun run seed:local
      # --with-deps is required in CI: the runner has none of Chromium's
      # shared libraries. Local installs skip it because it needs sudo.
      - run: bunx playwright install --with-deps chromium
      - name: Run E2E suite
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" \
          SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" \
          SUPABASE_SECRET_KEY="$SERVICE_ROLE_KEY" \
          SUPABASE_DB_URL="$DB_URL" \
          bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/report/html
            e2e/report/artifacts
          retention-days: 7
